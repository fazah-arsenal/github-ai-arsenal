name: CI Tests & Weekly Mega Index Update

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "0 4 * * 0" # Every Sunday at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check & Unit tests
        run: |
          python -m py_compile scripts/gh_arsenal.py scripts/build_mega_index.py
          python -m unittest discover -s tests -v

  refresh-index:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild 18,000+ GitHub Tools Mega Index
        run: python scripts/build_mega_index.py
      - name: Commit updated mega index if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet references/mega_index.json.gz; then
            git add references/mega_index.json.gz
            git commit -m "chore: weekly refresh of 18,000+ GitHub tools mega index"
            git push
          fi
