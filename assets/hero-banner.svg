    <text x="564" y="34" fill="#c084fc" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">Security Audit</text>
    <text x="564" y="58" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">Trust Score (0-100) &amp; Compare</text>
    <text x="564" y="78" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">License, Stars &amp; Risk Checks</text>

    <!-- Card 4 -->
    <rect x="816" y="0" width="264" height="96" rx="12" fill="url(#cardBg)" stroke="#22c55e" stroke-opacity="0.45"/>
    <text x="836" y="34" fill="#22c55e" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">8 Turnkey Stacks</text>
    <text x="836" y="58" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">1-Command Project Scaffolder</text>
    <text x="836" y="78" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">SaaS, Telegram Bot, RAG, Security</text>
