  </text>
  <text x="60" y="206" fill="#94a3b8" font-family="Segoe UI, Ubuntu, sans-serif" font-size="16">
    Works seamlessly with Antigravity • DeepSeek Harness • Claude Code • Cursor • Windsurf • Codex
  </text>

  <!-- 4 Feature Cards -->
  <g transform="translate(60, 235)">
    <!-- Card 1 -->
    <rect x="0" y="0" width="250" height="96" rx="12" fill="url(#cardBg)" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="20" y="34" fill="#38bdf8" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">20,078+ Tools</text>
    <text x="20" y="58" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">Instant Offline BM25 Search</text>
    <text x="20" y="78" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">37 Domains • Zero Rate Limits</text>

    <!-- Card 2 -->
    <rect x="272" y="0" width="250" height="96" rx="12" fill="url(#cardBg)" stroke="#818cf8" stroke-opacity="0.45"/>
    <text x="292" y="34" fill="#818cf8" font-family="Segoe UI, sans-serif" font-size="24" font-weight="800">Native MCP</text>
    <text x="292" y="58" fill="#cbd5e1" font-family="Segoe UI, sans-serif" font-size="13">12 Built-in JSON-RPC Tools</text>
    <text x="292" y="78" fill="#64748b" font-family="Segoe UI, sans-serif" font-size="12">Pure Python Stdlib • Auto Inject</text>

    <!-- Card 3 -->
