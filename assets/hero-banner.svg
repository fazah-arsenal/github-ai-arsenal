  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="18" fill="url(#bg)"/>
  <rect x="2" y="2" width="1196" height="416" rx="16" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.4"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="0.6" stroke-opacity="0.35">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="240" y1="0" x2="240" y2="420"/>
    <line x1="480" y1="0" x2="480" y2="420"/>
    <line x1="720" y1="0" x2="720" y2="420"/>
    <line x1="960" y1="0" x2="960" y2="420"/>
  </g>

  <!-- Glowing Orbs -->
  <circle cx="150" cy="80" r="120" fill="#38bdf8" opacity="0.08"/>
  <circle cx="1050" cy="330" r="160" fill="#a855f7" opacity="0.08"/>

  <!-- Top Pill Badge -->
  <rect x="60" y="38" width="370" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
  <circle cx="80" cy="54" r="5" fill="#22c55e"/>
  <text x="96" y="59" fill="#e2e8f0" font-family="Segoe UI, Ubuntu, sans-serif" font-size="13" font-weight="600">
