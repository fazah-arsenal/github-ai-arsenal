  </text>
  <text x="610" y="379" fill="#c084fc" font-family="Consolas, monospace" font-size="14" font-weight="600">
    Email: mhamadabdalla150150@gmail.com
  </text>
  <text x="975" y="379" fill="#22c55e" font-family="Consolas, monospace" font-size="13" font-weight="700">
